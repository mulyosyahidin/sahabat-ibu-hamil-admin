worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  # Gzip untuk asset teks
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css application/json application/javascript
    application/xml application/rss+xml text/javascript
    image/svg+xml application/font-woff application/font-woff2;

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Route SPA (React Router): fallback ke index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache ringan untuk asset fingerprinted
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
      expires 7d;
      add_header Cache-Control "public";
      access_log off;
      try_files $uri =404;
    }

    # (Opsional) blok akses ke file sensitif
    location ~* \.(?:env|ini|log|conf)$ {
      deny all;
    }
  }
}
